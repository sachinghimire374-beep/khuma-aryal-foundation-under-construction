<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Khuma Aryal Foundation — Site Under Construction</title>
<style>
  :root {
    --forest-900: #173b25;
    --forest-700: #2f7d45;
    --forest-600: #3f9654;
    --gilt-500: #c9a65b;
    --gilt-300: #ddc37e;
    --cream-100: #f8f7f2;
    --ink-600: #5f6862;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, var(--forest-900), var(--forest-700));
    color: var(--cream-100);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }

  .card {
    max-width: 560px;
  }

  .logo {
    display: block;
    width: 84px;
    height: 84px;
    border-radius: 16px;
    object-fit: cover;
    margin: 0 auto 24px;
    border: 1px solid rgba(221, 195, 126, 0.4);
  }

  .badge {
    display: inline-block;
    border: 1px solid var(--gilt-500);
    color: var(--gilt-300);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    margin: 0 0 16px;
    line-height: 1.2;
  }

  p {
    font-size: 16px;
    line-height: 1.6;
    color: rgba(248, 247, 242, 0.8);
    margin: 0 0 32px;
  }

  .rule {
    width: 64px;
    height: 3px;
    background: var(--gilt-500);
    margin: 0 auto 32px;
    border-radius: 2px;
  }

  .contact {
    font-size: 14px;
    color: rgba(248, 247, 242, 0.6);
  }

  .contact a {
    color: var(--gilt-300);
    text-decoration: none;
  }

  .contact a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.jpg" alt="Khuma Aryal Foundation logo" class="logo" />
    <span class="badge">Coming Soon</span>
    <h1>Khuma Aryal Foundation</h1>
    <div class="rule"></div>
    <p>Our website is currently under construction. We're working hard to bring you an updated look — please check back soon.</p>
    <p class="contact">In the meantime, reach us at <a href="mailto:info@khumaaryalfoundation.org">info@khumaaryalfoundation.org</a></p>
  </div>
</body>
</html>
